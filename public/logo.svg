<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#005bbf" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#1a73e8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a73e8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Tile Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- Central Smart AI / Microphone / Wave Icon Geometry -->
  <!-- Wave sound bars -->
  <rect x="24" y="44" width="6" height="12" rx="3" fill="#ffffff" opacity="0.75" />
  <rect x="34" y="36" width="6" height="28" rx="3" fill="#ffffff" opacity="0.9" />
  <rect x="44" y="28" width="12" height="44" rx="6" fill="#ffffff" />
  <rect x="60" y="36" width="6" height="28" rx="3" fill="#ffffff" opacity="0.9" />
  <rect x="70" y="44" width="6" height="12" rx="3" fill="#ffffff" opacity="0.75" />

  <!-- Smart AI Sparkle Dot -->
  <circle cx="74" cy="24" r="4" fill="#00d2ff" />
  <circle cx="74" cy="24" r="2" fill="#ffffff" />
</svg>
